[package]
name = "slave-trade-map"
version = "0.1.0"
authors = ["Clinton Bowen <clinton.bowen@gmail.com>"]
edition = "2021"

[dependencies]
anyhow = "1.0.104"
csv = "1.4.0"
dioxus = { version = "0.7.10", features = ["web"] }
dioxus-logger = "0.7.10"
js-sys = "0.3"
log = "0.4"
rusqlite = "0.38"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "console"] }

[build-dependencies]
csv = "1.4.0"

[features]
default = ["web"]
web = ["dioxus/web"]

[profile.release]
opt-level = 3
overflow-checks = false
incremental = true
panic = "unwind"
# strip = "symbols"

[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]
