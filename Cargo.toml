[package]
name = "slave-trade-map"
version = "0.1.0"
authors = ["Clinton Bowen <clinton.bowen@gmail.com>"]
edition = "2021"

[dependencies]
anyhow = "1.0.101"
csv = "1.4.0"
dioxus = { version = "0.7.1", features = ["web"] }
dioxus-logger = "0.7.3"
js-sys = "0.3"
log = "0.4"
rusqlite = "0.38"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"

[build-dependencies]
csv = "1.4.0"

[features]
default = ["web"]
web = ["dioxus/web"]
