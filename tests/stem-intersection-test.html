<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stem Intersection Tests</title>
<style>
  body { font-family: monospace; margin: 20px; background: #1a1a2e; color: #e0e0e0; }
  .pass { color: #4caf50; }
  .fail { color: #f44336; }
  .section { margin: 12px 0 4px; font-weight: bold; color: #82b1ff; }
  #results { white-space: pre-wrap; }
  .summary { margin-top: 16px; padding: 8px; border-top: 1px solid #555; font-size: 14px; }
</style>
</head>
<body>
<h2>Stem Intersection &amp; Convergence Ocean Tests</h2>
<svg id="scratch" width="0" height="0" style="position:absolute;visibility:hidden"></svg>
<div id="results"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script src="../assets/js/coords.js"></script>
<script src="../assets/js/route-planner.js"></script>
<script src="../assets/js/map-helpers.js"></script>
<script>
(function() {
  var out = document.getElementById("results");
  var passed = 0, failed = 0;

  function log(msg) { out.textContent += msg + "\n"; }
  function section(name) { log("\n--- " + name + " ---"); }
  function assert(name, condition) {
    if (condition) { passed++; log("  PASS: " + name); }
    else { failed++; log("  FAIL: " + name); }
  }

  // --- Geometry helpers ---

  function ccw(A, B, C) {
    return (C.y - A.y) * (B.x - A.x) > (B.y - A.y) * (C.x - A.x);
  }

  function segmentsCross(p1, p2, p3, p4) {
    return ccw(p1, p3, p4) !== ccw(p2, p3, p4) && ccw(p1, p2, p3) !== ccw(p1, p2, p4);
  }

  function dist(a, b) {
    return Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y));
  }

  function classifyCrossing(iA, iB, totalSamples, threshold) {
    threshold = threshold || 0.3;
    var tA = iA / totalSamples, tB = iB / totalSamples;
    if (tA < threshold && tB < threshold) return "approach-approach";
    if (tA >= threshold && tB >= threshold) return "ribbon-ribbon";
    return "approach-ribbon";
  }

  // Collector for Section C failures, used by Section F diagnostics
  var sectionCFailures = [];

  function sampleSVGPath(pathD, numSamples) {
    var svgEl = document.getElementById("scratch");
    var el = document.createElementNS("http://www.w3.org/2000/svg", "path");
    el.setAttribute("d", pathD);
    svgEl.appendChild(el);
    var len = el.getTotalLength();
    var pts = [];
    for (var i = 0; i <= numSamples; i++) {
      var p = el.getPointAtLength(len * i / numSamples);
      pts.push({ x: p.x, y: p.y });
    }
    el.remove();
    return pts;
  }

  function polylinesIntersect(samplesA, samplesB, exclusionPts, radius) {
    var crossings = [];
    for (var i = 0; i < samplesA.length - 1; i++) {
      for (var j = 0; j < samplesB.length - 1; j++) {
        if (segmentsCross(samplesA[i], samplesA[i+1], samplesB[j], samplesB[j+1])) {
          // Approximate crossing point as midpoint of the two segment midpoints
          var cx = (samplesA[i].x + samplesA[i+1].x + samplesB[j].x + samplesB[j+1].x) / 4;
          var cy = (samplesA[i].y + samplesA[i+1].y + samplesB[j].y + samplesB[j+1].y) / 4;
          var crossPt = { x: cx, y: cy };

          // Check exclusion zones
          var excluded = false;
          for (var e = 0; e < exclusionPts.length; e++) {
            if (dist(crossPt, exclusionPts[e]) < radius) {
              excluded = true;
              break;
            }
          }
          if (!excluded) {
            crossings.push({ x: cx, y: cy, iA: i, iB: j });
          }
        }
      }
    }
    return { intersects: crossings.length > 0, crossings: crossings };
  }

  // --- Fréchet coupling helpers ---

  function discreteFrechetWithCoupling(P, Q) {
    var n = P.length, m = Q.length;
    if (n === 0 || m === 0) return { distance: Infinity, coupling: [] };
    var dp = [];
    for (var i = 0; i < n; i++) {
      dp[i] = new Float64Array(m);
      for (var j = 0; j < m; j++) {
        var d = Math.sqrt((P[i].x-Q[j].x)**2 + (P[i].y-Q[j].y)**2);
        if (i === 0 && j === 0) dp[i][j] = d;
        else if (i === 0) dp[i][j] = Math.max(dp[0][j-1], d);
        else if (j === 0) dp[i][j] = Math.max(dp[i-1][0], d);
        else dp[i][j] = Math.max(Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]), d);
      }
    }
    var coupling = [];
    var i = n - 1, j = m - 1;
    coupling.push([i, j]);
    while (i > 0 || j > 0) {
      if (i === 0) { j--; }
      else if (j === 0) { i--; }
      else {
        var candidates = [
          [i-1, j-1, dp[i-1][j-1]],
          [i-1, j, dp[i-1][j]],
          [i, j-1, dp[i][j-1]]
        ];
        candidates.sort(function(a, b) { return a[2] - b[2]; });
        i = candidates[0][0];
        j = candidates[0][1];
      }
      coupling.push([i, j]);
    }
    coupling.reverse();
    return { distance: dp[n-1][m-1], coupling: coupling };
  }

  function couplingLinesCross(samplesA, samplesB, coupling, convergePt, radius) {
    var crossCount = 0;
    var firstCross = null;
    for (var k = 0; k < coupling.length - 1; k++) {
      var ai = coupling[k][0], bi = coupling[k][1];
      var aj = coupling[k+1][0], bj = coupling[k+1][1];
      var pA1 = samplesA[ai], pA2 = samplesB[bi];
      var pB1 = samplesA[aj], pB2 = samplesB[bj];
      if (ai === aj && bi === bj) continue;
      if (convergePt) {
        var cp = { x: convergePt[0], y: convergePt[1] };
        if (dist(pA1, cp) < radius && dist(pA2, cp) < radius &&
            dist(pB1, cp) < radius && dist(pB2, cp) < radius) continue;
      }
      if (segmentsCross(pA1, pA2, pB1, pB2)) {
        crossCount++;
        if (!firstCross) firstCross = { k: k, ai: ai, bi: bi };
      }
    }
    return { crossed: crossCount > 0, count: crossCount, first: firstCross };
  }

  // --- Convergence point computation (mirrors renderFlowGroup in map-flows.js) ---

  function computeConvergePt(projection, destCode) {
    var dc = regionCoords[destCode];
    if (!dc) return null;
    var destPt = projection([dc.lng, dc.lat]);
    if (!destPt) return null;

    var SOURCES = [60100, 60200, 60300, 60400, 60500, 60600, 60700, 60800, 60900];
    var westmostSourceX = Infinity;
    SOURCES.forEach(function(src) {
      var sc = getCoords(src);
      if (!sc) return;
      var pt = projection([sc.lng, sc.lat]);
      if (pt && pt[0] < westmostSourceX) westmostSourceX = pt[0];
    });

    var convergeX = (westmostSourceX + destPt[0]) / 2;

    var destQuadrant = classifyDestQuadrant(destCode);
    var refLat = { "caribbean": 8, "north-america": 25, "brazil-north": -3,
      "brazil-south": -12, "rio-plata": -20, "europe": 35 }[destQuadrant] || 5;
    var refPt = projection([0, refLat]);
    var convergeY = refPt ? refPt[1] : destPt[1];

    var convergePt = [convergeX, convergeY];

    // Ocean guard (mirrors map-flows.js)
    if (window._landFeatures && projection.invert) {
      var geo = projection.invert(convergePt);
      if (geo) {
        var onLand = false;
        for (var li = 0; li < window._landFeatures.length; li++) {
          if (d3.geoContains(window._landFeatures[li], geo)) { onLand = true; break; }
        }
        if (onLand) {
          var safeGeo = [geo[0], geo[1]];
          for (var shift = 5; shift <= 40; shift += 5) {
            safeGeo[0] = geo[0] + shift;
            var still = false;
            for (var li2 = 0; li2 < window._landFeatures.length; li2++) {
              if (d3.geoContains(window._landFeatures[li2], safeGeo)) { still = true; break; }
            }
            if (!still) break;
          }
          var safePt = projection(safeGeo);
          if (safePt) convergePt = [safePt[0], safePt[1]];
        }
      }
    }

    return convergePt;
  }

  // --- Main test runner ---

  var WORLD_URL = "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json";
  var SOURCES = [60100, 60200, 60300, 60400, 60500, 60600, 60700, 60800, 60900];
  var NUM_SAMPLES = 50;
  var EXCLUSION_RADIUS = 15;

  var DESTINATIONS = [
    // Caribbean (core island destinations)
    { code: 35100, name: "Jamaica",           quadrant: "caribbean" },
    { code: 36400, name: "Saint-Domingue",    quadrant: "caribbean" },
    { code: 31312, name: "Havana",            quadrant: "caribbean" },
    { code: 34200, name: "Barbados",          quadrant: "caribbean" },
    { code: 36100, name: "Martinique",        quadrant: "caribbean" },
    { code: 36200, name: "Guadeloupe",        quadrant: "caribbean" },
    { code: 33400, name: "Antigua",           quadrant: "caribbean" },
    { code: 34500, name: "Trinidad",          quadrant: "caribbean" },
    { code: 37010, name: "St. Croix",         quadrant: "caribbean" },
    { code: 32110, name: "Curacao",           quadrant: "caribbean" },
    { code: 34400, name: "Grenada",           quadrant: "caribbean" },
    // Caribbean (Spanish mainland coast)
    { code: 41203, name: "Veracruz",          quadrant: "caribbean" },
    { code: 41207, name: "Cartagena",         quadrant: "caribbean" },
    { code: 41210, name: "Venezuela",         quadrant: "caribbean" },
    // North America (lat > 25)
    { code: 21300, name: "Charleston",        quadrant: "north-america" },
    { code: 21601, name: "New Orleans",       quadrant: "north-america" },
    { code: 20100, name: "Rhode Island",      quadrant: "north-america" },
    { code: 20400, name: "Massachusetts",     quadrant: "north-america" },
    { code: 21400, name: "Georgia",           quadrant: "north-america" },
    { code: 21100, name: "Virginia",          quadrant: "north-america" },
    // Brazil North
    { code: 50300, name: "Pernambuco",        quadrant: "brazil-north" },
    { code: 50100, name: "Amazonia",          quadrant: "brazil-north" },
    { code: 36300, name: "French Guiana",     quadrant: "brazil-north" },
    { code: 50102, name: "Maranhao",          quadrant: "brazil-north" },
    // Brazil South
    { code: 50200, name: "Bahia",             quadrant: "brazil-south" },
    { code: 50422, name: "Rio de Janeiro",    quadrant: "brazil-south" },
    { code: 50500, name: "Other Brazil",      quadrant: "brazil-south" },
    { code: 50428, name: "Santos",            quadrant: "brazil-south" },
    // Rio de la Plata
    { code: 42001, name: "Buenos Aires",      quadrant: "rio-plata" },
    { code: 42002, name: "Montevideo",        quadrant: "rio-plata" },
    // Europe
    { code: 10203, name: "Lisbon",            quadrant: "europe" },
    { code: 10404, name: "Bristol",           quadrant: "europe" },
    { code: 10432, name: "Liverpool",         quadrant: "europe" },
    { code: 10720, name: "Nantes",            quadrant: "europe" },
    { code: 10703, name: "Bordeaux",          quadrant: "europe" },
    { code: 10810, name: "Amsterdam",         quadrant: "europe" },
    { code: 10104, name: "Cadiz",             quadrant: "europe" },
    { code: 10901, name: "Copenhagen",        quadrant: "europe" }
  ];

  d3.json(WORLD_URL).then(function(world) {
    var countries = topojson.feature(world, world.objects.countries);
    window._landFeatures = countries.features;

    var projection = d3.geoNaturalEarth1().center([-15, 5]).scale(210).translate([600, 320]);
    window._projection = projection;

    // ---- Test A: Quadrant classification ----
    section("A. Quadrant classification for test destinations");
    DESTINATIONS.forEach(function(d) {
      var q = classifyDestQuadrant(d.code);
      assert(d.name + " (" + d.code + ") => " + d.quadrant, q === d.quadrant);
    });

    // ---- Test B: Convergence point is over ocean ----
    section("B. Convergence point is over ocean for all destinations");
    DESTINATIONS.forEach(function(d) {
      var convergePt = computeConvergePt(projection, d.code);
      if (!convergePt) {
        assert(d.name + " convergePt exists", false);
        return;
      }
      var geo = projection.invert(convergePt);
      var onLand = false;
      if (geo) {
        for (var li = 0; li < window._landFeatures.length; li++) {
          if (d3.geoContains(window._landFeatures[li], geo)) { onLand = true; break; }
        }
      }
      assert(d.name + " (" + d.code + ") convergePt over ocean", !onLand);
    });

    // ---- Test C: Stem intersection tests ----
    section("C. No stem crossings (excluding convergence/source zones)");
    DESTINATIONS.forEach(function(d) {
      _waypointCache = {};
      var convergePt = computeConvergePt(projection, d.code);
      if (!convergePt) {
        assert(d.name + " stems — convergePt exists", false);
        return;
      }

      // Pre-populate cache via ribbon system
      var stemInfos = [];
      SOURCES.forEach(function(src) {
        var sc = getCoords(src);
        if (!sc) return;
        var srcPt = projection([sc.lng, sc.lat]);
        if (!srcPt) return;
        stemInfos.push({ sourceCode: src, srcPt: srcPt, destCode: d.code });
      });
      if (typeof computeRibbonStems === 'function') {
        computeRibbonStems(stemInfos, convergePt, d.code);
      }

      // Build SVG paths for each source stem (using ribbon-populated cache)
      var stemPaths = [];
      var sourcePts = [];
      SOURCES.forEach(function(src) {
        var sc = getCoords(src);
        if (!sc) return;
        var srcPt = projection([sc.lng, sc.lat]);
        if (!srcPt) return;
        sourcePts.push({ x: srcPt[0], y: srcPt[1] });

        var wps = computeDynamicWaypoints(src, d.code, convergePt);
        var allPoints = [srcPt];
        if (wps) {
          if (wps._screen) {
            for (var w = 0; w < wps.points.length; w++) {
              allPoints.push(wps.points[w]);
            }
          } else {
            for (var w = 0; w < wps.length; w++) {
              var pp = projection([wps[w].lng, wps[w].lat]);
              if (pp) allPoints.push(pp);
            }
          }
        }
        allPoints.push(convergePt);

        var pathD = generateMultiSegmentPath(allPoints);
        if (pathD) {
          stemPaths.push({ src: src, pathD: pathD });
        }
      });

      // Sample all paths
      var stemSamples = stemPaths.map(function(sp) {
        return { src: sp.src, samples: sampleSVGPath(sp.pathD, NUM_SAMPLES) };
      });

      // Build exclusion points: convergePt + all source points
      var exclusionPts = [{ x: convergePt[0], y: convergePt[1] }].concat(sourcePts);

      // Check all pairs — collect ALL crossings for diagnostic use in Section F
      var allCrossings = [];
      for (var i = 0; i < stemSamples.length; i++) {
        for (var j = i + 1; j < stemSamples.length; j++) {
          var result = polylinesIntersect(
            stemSamples[i].samples, stemSamples[j].samples,
            exclusionPts, EXCLUSION_RADIUS
          );
          if (result.intersects) {
            for (var ci = 0; ci < result.crossings.length; ci++) {
              allCrossings.push({
                srcA: stemSamples[i].src, srcB: stemSamples[j].src,
                x: result.crossings[ci].x, y: result.crossings[ci].y,
                iA: result.crossings[ci].iA, iB: result.crossings[ci].iB
              });
            }
          }
        }
      }
      var crossingFound = allCrossings.length > 0;
      var crossingDetail = "";
      if (crossingFound) {
        crossingDetail = " (" + allCrossings[0].srcA + " x " + allCrossings[0].srcB +
          " at " + Math.round(allCrossings[0].x) + "," + Math.round(allCrossings[0].y) +
          ", " + allCrossings.length + " total)";
        sectionCFailures.push({ dest: d, crossings: allCrossings, stemSamples: stemSamples });
      }
      assert(d.name + " (" + d.code + ") no stem crossings" + crossingDetail, !crossingFound);
    });

    // ---- Test D: Adjacent stem coupling lines do not cross (parallel behavior) ----
    var COUPLING_SAMPLES = 100;
    var COUPLING_EXCLUSION = 20;
    section("D. Adjacent stem coupling lines do not cross (parallel behavior)");
    DESTINATIONS.forEach(function(d) {
      _waypointCache = {};
      var convergePt = computeConvergePt(projection, d.code);
      if (!convergePt) {
        assert(d.name + " coupling — convergePt exists", false);
        return;
      }

      // Pre-populate cache via ribbon system
      var stemInfos = [];
      SOURCES.forEach(function(src) {
        var sc = getCoords(src);
        if (!sc) return;
        var srcPt = projection([sc.lng, sc.lat]);
        if (!srcPt) return;
        stemInfos.push({ sourceCode: src, srcPt: srcPt, destCode: d.code });
      });
      if (typeof computeRibbonStems === 'function') {
        computeRibbonStems(stemInfos, convergePt, d.code);
      }

      // Build stem paths with source info for sorting (using ribbon-populated cache)
      var stemData = [];
      SOURCES.forEach(function(src) {
        var sc = getCoords(src);
        if (!sc) return;
        var srcPt = projection([sc.lng, sc.lat]);
        if (!srcPt) return;

        var wps = computeDynamicWaypoints(src, d.code, convergePt);
        var allPoints = [srcPt];
        if (wps) {
          if (wps._screen) {
            for (var w = 0; w < wps.points.length; w++) {
              allPoints.push(wps.points[w]);
            }
          } else {
            for (var w = 0; w < wps.length; w++) {
              var pp = projection([wps[w].lng, wps[w].lat]);
              if (pp) allPoints.push(pp);
            }
          }
        }
        allPoints.push(convergePt);

        var pathD = generateMultiSegmentPath(allPoints);
        if (pathD) {
          stemData.push({ src: src, lat: sc.lat, pathD: pathD });
        }
      });

      // Sort by source latitude (south→north), SE Africa (60800) pinned to bottom
      stemData.sort(function(a, b) {
        var srcA = Math.floor(a.src / 100) * 100;
        var srcB = Math.floor(b.src / 100) * 100;
        if (srcA === 60800 && srcB !== 60800) return 1;
        if (srcB === 60800 && srcA !== 60800) return -1;
        return b.lat - a.lat;
      });

      // Sample paths at higher resolution for coupling
      var stemSamplesD = stemData.map(function(sd) {
        return { src: sd.src, samples: sampleSVGPath(sd.pathD, COUPLING_SAMPLES) };
      });

      // Check consecutive pairs
      for (var i = 0; i < stemSamplesD.length - 1; i++) {
        var sA = stemSamplesD[i], sB = stemSamplesD[i + 1];
        var result = discreteFrechetWithCoupling(sA.samples, sB.samples);
        var check = couplingLinesCross(sA.samples, sB.samples, result.coupling, convergePt, COUPLING_EXCLUSION);
        var detail = "";
        if (check.crossed) {
          detail = " (coupling idx " + check.first.k + ", " + check.count + " crossings)";
        }
        assert(d.name + " " + sA.src + "↔" + sB.src + " coupling ok" + detail, !check.crossed);
      }
    });

    // ---- Section E: Cache Population Audit ----
    section("E. Cache population audit (ribbon system)");
    DESTINATIONS.forEach(function(d) {
      _waypointCache = {};
      var convergePt = computeConvergePt(projection, d.code);
      if (!convergePt) {
        log("  SKIP: " + d.name + " — no convergePt");
        return;
      }

      var stemInfos = [];
      SOURCES.forEach(function(src) {
        var sc = getCoords(src);
        if (!sc) return;
        var srcPt = projection([sc.lng, sc.lat]);
        if (!srcPt) return;
        stemInfos.push({ sourceCode: src, srcPt: srcPt, destCode: d.code });
      });
      if (typeof computeRibbonStems === 'function') {
        computeRibbonStems(stemInfos, convergePt, d.code);
      }

      var cached = 0, maxApproach = 0, approachDetails = [];
      SOURCES.forEach(function(src) {
        var key = src + ":" + d.code + ":" + Math.round(convergePt[0]) + ":" + Math.round(convergePt[1]);
        if (_waypointCache[key]) {
          cached++;
          var wps = _waypointCache[key];
          var wpCount, firstWp;
          if (wps._screen) {
            wpCount = wps.points.length;
            firstWp = wps.points[0]; // already [x, y]
          } else {
            wpCount = wps.length;
            firstWp = projection([wps[0].lng, wps[0].lat]);
          }
          var sc = getCoords(src);
          var srcPt = sc ? projection([sc.lng, sc.lat]) : null;
          var approachDist = 0;
          if (firstWp && srcPt) {
            approachDist = dist({x:srcPt[0],y:srcPt[1]}, {x:firstWp[0],y:firstWp[1]});
            if (approachDist > maxApproach) maxApproach = approachDist;
          }
          approachDetails.push({ src: src, wpCount: wpCount, approach: approachDist });
        } else {
          approachDetails.push({ src: src, wpCount: 0, approach: -1 });
        }
      });
      assert(d.name + " all 9 cached", cached === 9);
      log("    max approach dist: " + maxApproach.toFixed(0) + "px");
      var longApproach = approachDetails.filter(function(a) { return a.approach > 80; });
      if (longApproach.length > 0) {
        log("    WARNING: " + longApproach.length + " source(s) with approach > 80px:");
        longApproach.forEach(function(a) {
          log("      " + a.src + ": " + a.approach.toFixed(0) + "px (" + a.wpCount + " waypoints)");
        });
      }
      var uncached = approachDetails.filter(function(a) { return a.wpCount === 0; });
      if (uncached.length > 0) {
        log("    MISSING from cache: " + uncached.map(function(a) { return a.src; }).join(", "));
      }
    });

    // ---- Section F: Crossing Zone Classifier ----
    section("F. Crossing zone classifier (for Section C failures)");
    if (sectionCFailures.length === 0) {
      log("  No Section C failures to classify — all stems non-crossing!");
    }
    sectionCFailures.forEach(function(failure) {
      var d = failure.dest;
      var crossings = failure.crossings;
      var zones = { "approach-approach": 0, "approach-ribbon": 0, "ribbon-ribbon": 0 };
      var zoneDetails = [];
      crossings.forEach(function(c) {
        var zone = classifyCrossing(c.iA, c.iB, NUM_SAMPLES, 0.3);
        zones[zone]++;
        var tA = (c.iA / NUM_SAMPLES).toFixed(2);
        var tB = (c.iB / NUM_SAMPLES).toFixed(2);
        zoneDetails.push(zone + " t=(" + tA + "," + tB + ") " + c.srcA + "x" + c.srcB);
      });
      log("  " + d.name + " (" + d.code + "): " + crossings.length + " crossings");
      log("    approach-approach: " + zones["approach-approach"] +
          "  approach-ribbon: " + zones["approach-ribbon"] +
          "  ribbon-ribbon: " + zones["ribbon-ribbon"]);
      if (zones["ribbon-ribbon"] > 0) {
        log("    *** RIBBON-RIBBON CROSSING DETECTED — ribbon math may have a bug ***");
      }
      // Show first few details
      var showCount = Math.min(zoneDetails.length, 5);
      for (var i = 0; i < showCount; i++) {
        log("    [" + (i+1) + "] " + zoneDetails[i]);
      }
      if (zoneDetails.length > showCount) {
        log("    ... and " + (zoneDetails.length - showCount) + " more");
      }
    });

    // ---- Section G: Ribbon Entry Position Map ----
    section("G. Ribbon entry position map (offset ordering check)");
    DESTINATIONS.forEach(function(d) {
      _waypointCache = {};
      var convergePt = computeConvergePt(projection, d.code);
      if (!convergePt) return;

      var stemInfos = [];
      SOURCES.forEach(function(src) {
        var sc = getCoords(src);
        if (!sc) return;
        var srcPt = projection([sc.lng, sc.lat]);
        if (!srcPt) return;
        stemInfos.push({ sourceCode: src, srcPt: srcPt, destCode: d.code });
      });
      if (typeof computeRibbonStems === 'function') {
        computeRibbonStems(stemInfos, convergePt, d.code);
      }

      // Sort sources north-to-south (matching ribbon sort order in computeRibbonStems)
      var sortedSources = SOURCES.filter(function(src) {
        return Math.floor(src / 100) * 100 !== 60800;
      }).sort(function(a, b) {
        var scA = getCoords(a), scB = getCoords(b);
        return (scB ? scB.lat : 0) - (scA ? scA.lat : 0);
      });
      // Append 60800 at end
      sortedSources.push(60800);

      var entries = [];
      sortedSources.forEach(function(src, idx) {
        var sc = getCoords(src);
        if (!sc) return;
        var srcPt = projection([sc.lng, sc.lat]);
        if (!srcPt) return;
        var key = src + ":" + d.code + ":" + Math.round(convergePt[0]) + ":" + Math.round(convergePt[1]);
        var wps = _waypointCache[key];
        var ribbonEntry = null, approachDist = 0;
        if (wps) {
          if (wps._screen && wps.points.length > 0) {
            ribbonEntry = wps.points[0]; // already [x, y]
          } else if (!wps._screen && wps.length > 0) {
            ribbonEntry = projection([wps[0].lng, wps[0].lat]);
          }
          if (ribbonEntry) {
            approachDist = dist({x:srcPt[0],y:srcPt[1]}, {x:ribbonEntry[0],y:ribbonEntry[1]});
          }
        }
        entries.push({
          sortIndex: idx, src: src,
          srcX: srcPt[0], srcY: srcPt[1],
          entryX: ribbonEntry ? ribbonEntry[0] : null,
          entryY: ribbonEntry ? ribbonEntry[1] : null,
          approachDist: approachDist
        });
      });

      // Check ordering: consecutive ribbon entries should have consistent dot product with source spread
      var misordered = false;
      var validEntries = entries.filter(function(e) { return e.entryX !== null; });
      if (validEntries.length >= 2) {
        var spreadDx = validEntries[validEntries.length-1].srcX - validEntries[0].srcX;
        var spreadDy = validEntries[validEntries.length-1].srcY - validEntries[0].srcY;
        var spreadLen = Math.sqrt(spreadDx*spreadDx + spreadDy*spreadDy);
        if (spreadLen > 0.001) {
          spreadDx /= spreadLen; spreadDy /= spreadLen;
          for (var i = 1; i < validEntries.length; i++) {
            var dx = validEntries[i].entryX - validEntries[i-1].entryX;
            var dy = validEntries[i].entryY - validEntries[i-1].entryY;
            var dotProduct = dx * spreadDx + dy * spreadDy;
            if (dotProduct < -1) { // tolerance of -1px
              misordered = true;
              break;
            }
          }
        }
      }

      // Only show table for failing destinations or misordered entries
      var isFailing = sectionCFailures.some(function(f) { return f.dest.code === d.code; });
      if (isFailing || misordered) {
        log("  " + d.name + " (" + d.code + ")" + (misordered ? " *** MISORDERED ***" : ""));
        log("    idx  source   srcPt          ribbonEntry      approach");
        entries.forEach(function(e) {
          var srcStr = e.srcX.toFixed(0) + "," + e.srcY.toFixed(0);
          var entStr = e.entryX !== null ? (e.entryX.toFixed(0) + "," + e.entryY.toFixed(0)) : "N/A";
          log("    " + e.sortIndex + "    " + e.src + "   (" + srcStr + ")   (" + entStr + ")   " + e.approachDist.toFixed(0) + "px");
        });
      }
      assert(d.name + " ribbon entries ordered", !misordered);
    });

    // ---- Section H: Spine Geometry Dump (first 3 failing destinations) ----
    section("H. Spine geometry dump (first 3 Section C failures)");
    var hFailures = sectionCFailures.slice(0, 3);
    if (hFailures.length === 0) {
      log("  No Section C failures — spine geometry looks correct.");
    }
    hFailures.forEach(function(failure) {
      var d = failure.dest;
      _waypointCache = {};
      var convergePt = computeConvergePt(projection, d.code);
      if (!convergePt) { log("  SKIP: " + d.name + " — no convergePt"); return; }

      var stemInfos = [];
      SOURCES.forEach(function(src) {
        var sc = getCoords(src);
        if (!sc) return;
        var srcPt = projection([sc.lng, sc.lat]);
        if (!srcPt) return;
        stemInfos.push({ sourceCode: src, srcPt: srcPt, destCode: d.code });
      });

      // Recompute spine directly
      var spinePoints = computeSpine(stemInfos, convergePt, d.code);
      if (!spinePoints || spinePoints.length < 2) {
        log("  " + d.name + ": spine computation returned null/empty");
        return;
      }

      var NUM_SP = 40;
      var spineSamples = arcLengthReparameterize(spinePoints, NUM_SP);
      var frame = computeFrenetFrame(spineSamples);

      // Median source
      var groupA = stemInfos.filter(function(info) {
        return Math.floor(info.sourceCode / 100) * 100 !== 60800;
      });
      var sorted = groupA.slice().sort(function(a, b) {
        var scA = getCoords(a.sourceCode), scB = getCoords(b.sourceCode);
        return (scA ? scA.lat : 0) - (scB ? scB.lat : 0);
      });
      var medianSource = sorted[Math.floor(sorted.length / 2)];

      // Centroid
      var sumX = 0, sumY = 0;
      groupA.forEach(function(info) { sumX += info.srcPt[0]; sumY += info.srcPt[1]; });
      var centroid = [sumX / groupA.length, sumY / groupA.length];

      // Offset sign
      var sortedNS = groupA.slice().sort(function(a, b) {
        var scA = getCoords(a.sourceCode), scB = getCoords(b.sourceCode);
        return (scB ? scB.lat : 0) - (scA ? scA.lat : 0);
      });
      var firstSrc = sortedNS[0].srcPt;
      var lastSrc = sortedNS[sortedNS.length - 1].srcPt;
      var spreadDx = lastSrc[0] - firstSrc[0];
      var spreadDy = lastSrc[1] - firstSrc[1];
      var dot = spreadDx * frame.normals[0][0] + spreadDy * frame.normals[0][1];
      var sign = dot >= 0 ? 1 : -1;

      log("  " + d.name + " (" + d.code + ") quadrant=" + d.quadrant);
      log("    median source: " + medianSource.sourceCode);
      log("    spine start (centroid): " + centroid[0].toFixed(1) + "," + centroid[1].toFixed(1));
      var centroidGeo = projection.invert(centroid);
      if (centroidGeo) {
        log("    centroid geo: " + centroidGeo[1].toFixed(2) + "°N, " + centroidGeo[0].toFixed(2) + "°E");
        var centroidOnLand = false;
        if (window._landFeatures) {
          for (var li = 0; li < window._landFeatures.length; li++) {
            if (d3.geoContains(window._landFeatures[li], centroidGeo)) { centroidOnLand = true; break; }
          }
        }
        log("    centroid on land: " + centroidOnLand);
      }
      log("    spine tangent at 0: " + frame.tangents[0][0].toFixed(3) + "," + frame.tangents[0][1].toFixed(3));
      log("    spine normal at 0: " + frame.normals[0][0].toFixed(3) + "," + frame.normals[0][1].toFixed(3));
      log("    offset sign: " + sign + " (dot=" + dot.toFixed(1) + ")");
      log("    stem order & offsets (spacing=" + STEM_MIN_SPACING + "):");
      sortedNS.forEach(function(info, idx) {
        var d_i = sign * (idx - (sortedNS.length - 1) / 2) * STEM_MIN_SPACING;
        log("      [" + idx + "] " + info.sourceCode + " offset=" + d_i.toFixed(1) + "px");
      });
    });

    // ---- Section I: Visual Crossing Overlay ----
    section("I. Visual crossing overlay");
    if (sectionCFailures.length === 0) {
      log("  No Section C failures — skipping visual overlay.");
    } else {
      var canvas = document.createElement("canvas");
      canvas.width = 800; canvas.height = 500;
      canvas.style.border = "1px solid #555";
      canvas.style.display = "block";
      canvas.style.marginTop = "12px";
      canvas.style.background = "#0a0a1e";
      document.body.appendChild(canvas);
      var ctx = canvas.getContext("2d");

      // Draw simplified coastline
      if (window._landFeatures) {
        ctx.strokeStyle = "#333";
        ctx.lineWidth = 0.5;
        var pathGen = d3.geoPath().projection(projection).context(ctx);
        ctx.beginPath();
        pathGen({ type: "FeatureCollection", features: window._landFeatures });
        ctx.stroke();
      }

      var stemColors = [
        "#e6194b", "#3cb44b", "#ffe119", "#4363d8", "#f58231",
        "#911eb4", "#42d4f4", "#f032e6", "#bfef45"
      ];

      // Draw diagnostics for first failing destination
      var showFailure = sectionCFailures[0];
      log("  Overlay showing: " + showFailure.dest.name + " (" + showFailure.dest.code + ")");

      _waypointCache = {};
      var overlayConverge = computeConvergePt(projection, showFailure.dest.code);
      var overlayInfos = [];
      SOURCES.forEach(function(src) {
        var sc = getCoords(src);
        if (!sc) return;
        var srcPt = projection([sc.lng, sc.lat]);
        if (!srcPt) return;
        overlayInfos.push({ sourceCode: src, srcPt: srcPt, destCode: showFailure.dest.code });
      });
      if (typeof computeRibbonStems === 'function') {
        computeRibbonStems(overlayInfos, overlayConverge, showFailure.dest.code);
      }

      // Draw spine
      var spinePoints = computeSpine(overlayInfos, overlayConverge, showFailure.dest.code);
      if (spinePoints && spinePoints.length >= 2) {
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(spinePoints[0][0], spinePoints[0][1]);
        for (var k = 1; k < spinePoints.length; k++) {
          ctx.lineTo(spinePoints[k][0], spinePoints[k][1]);
        }
        ctx.stroke();
      }

      // Draw convergence point as white star
      if (overlayConverge) {
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        var cx = overlayConverge[0], cy = overlayConverge[1];
        for (var p = 0; p < 10; p++) {
          var angle = (p * Math.PI / 5) - Math.PI / 2;
          var r = (p % 2 === 0) ? 6 : 3;
          if (p === 0) ctx.moveTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
          else ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
        }
        ctx.closePath();
        ctx.fill();
      }

      // Draw each source → ribbon entry → stem
      SOURCES.forEach(function(src, idx) {
        var sc = getCoords(src);
        if (!sc) return;
        var srcPt = projection([sc.lng, sc.lat]);
        if (!srcPt) return;
        var color = stemColors[idx % stemColors.length];

        // Source dot
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(srcPt[0], srcPt[1], 4, 0, 2 * Math.PI);
        ctx.fill();

        // Ribbon entry dot + approach line
        var key = src + ":" + showFailure.dest.code + ":" +
          Math.round(overlayConverge[0]) + ":" + Math.round(overlayConverge[1]);
        var wps = _waypointCache[key];
        var firstWp = null;
        if (wps) {
          if (wps._screen && wps.points.length > 0) {
            firstWp = wps.points[0];
          } else if (!wps._screen && wps.length > 0) {
            firstWp = projection([wps[0].lng, wps[0].lat]);
          }
        }
        if (firstWp) {
            // Small ribbon entry dot
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            ctx.arc(firstWp[0], firstWp[1], 2.5, 0, 2 * Math.PI);
            ctx.fill();
            ctx.globalAlpha = 1;

            // Approach line (dashed)
            ctx.strokeStyle = color;
            ctx.lineWidth = 0.8;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(srcPt[0], srcPt[1]);
            ctx.lineTo(firstWp[0], firstWp[1]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // Draw full stem path (using SVG samples already computed)
        var stemSample = showFailure.stemSamples.find(function(s) { return s.src === src; });
        if (stemSample) {
          ctx.strokeStyle = color;
          ctx.lineWidth = 1;
          ctx.globalAlpha = 0.5;
          ctx.beginPath();
          ctx.moveTo(stemSample.samples[0].x, stemSample.samples[0].y);
          for (var k = 1; k < stemSample.samples.length; k++) {
            ctx.lineTo(stemSample.samples[k].x, stemSample.samples[k].y);
          }
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      });

      // Draw crossing points as red X markers
      showFailure.crossings.forEach(function(c) {
        ctx.strokeStyle = "#ff0000";
        ctx.lineWidth = 2;
        var sz = 4;
        ctx.beginPath();
        ctx.moveTo(c.x - sz, c.y - sz); ctx.lineTo(c.x + sz, c.y + sz);
        ctx.moveTo(c.x + sz, c.y - sz); ctx.lineTo(c.x - sz, c.y + sz);
        ctx.stroke();
      });

      // Legend
      ctx.fillStyle = "#aaa";
      ctx.font = "11px monospace";
      ctx.fillText("Overlay: " + showFailure.dest.name + " — " +
        showFailure.crossings.length + " crossing(s)", 10, canvas.height - 10);
      log("  Red X = crossing point, dashed = approach line, solid = stem path");
    }

    // ---- Summary ----
    log("\n============================================");
    log("Total: " + (passed + failed) + "  Passed: " + passed + "  Failed: " + failed);
    if (failed === 0) log("ALL TESTS PASSED");
    else log(failed + " TEST(S) FAILED");

  }).catch(function(err) {
    log("ERROR: Could not load world topology: " + err);
  });
})();
</script>
</body>
</html>
