<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Route Visual Test</title>
<style>
  body { font-family: sans-serif; margin: 0; background: #1a1a2e; color: #e0e0e0; }
  #controls { padding: 10px 16px; background: #16213e; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #controls label { font-size: 13px; margin-right: 4px; }
  #controls button {
    padding: 5px 12px; border: 1px solid #555; border-radius: 4px;
    background: #0f3460; color: #e0e0e0; cursor: pointer; font-size: 12px;
  }
  #controls button:hover { background: #1a508b; }
  #controls button.active { background: #e94560; border-color: #e94560; }
  svg { display: block; }
  .land { fill: #2a2a4a; stroke: #444; stroke-width: 0.4px; }
  .graticule { fill: none; stroke: #333; stroke-width: 0.3px; }
  .route { fill: none; stroke-linecap: round; opacity: 0.8; }
  .waypoint-dot { fill: #ff0; stroke: #000; stroke-width: 0.5px; }
  .source-dot { fill: #4caf50; stroke: #fff; stroke-width: 0.8px; }
  .dest-dot { fill: #e94560; stroke: #fff; stroke-width: 0.8px; }
  #info { padding: 8px 16px; font-size: 12px; color: #aaa; }
</style>
</head>
<body>
<div id="controls">
  <label>Destination:</label>
  <button data-dest="35100" class="active">Jamaica (35100)</button>
  <button data-dest="50200">Bahia (50200)</button>
  <button data-dest="21300">Charleston (21300)</button>
  <button data-dest="42001">Buenos Aires (42001)</button>
  <button data-dest="36400">Saint-Domingue (36400)</button>
  <button data-dest="10203">Lisbon (10203)</button>
  <button data-dest="31312">Havana (31312)</button>
  <button data-dest="50422">Rio de Janeiro (50422)</button>
  <button data-dest="41203">Veracruz (41203)</button>
  <button data-dest="21601">New Orleans (21601)</button>
</div>
<div id="map"></div>
<div id="info">Click a destination to render all African source routes. Yellow dots = waypoints. Green = sources. Red = destination.</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script src="../assets/js/coords.js"></script>
<script src="../assets/js/route-planner.js"></script>
<script>
(function() {
  var width = 1200, height = 620;
  var SOURCES = [60100, 60200, 60300, 60400, 60500, 60600, 60700, 60800, 60900];
  var SOURCE_COLORS = [
    "#e6194b", "#3cb44b", "#ffe119", "#4363d8", "#f58231",
    "#911eb4", "#42d4f4", "#f032e6", "#bfef45"
  ];

  var svg = d3.select("#map").append("svg")
    .attr("viewBox", "0 0 " + width + " " + height)
    .attr("preserveAspectRatio", "xMidYMid meet");

  svg.append("rect").attr("width", width).attr("height", height).attr("fill", "#0f0f23");

  var projection = d3.geoNaturalEarth1().center([-15, 5]).scale(210).translate([width / 2, height / 2 + 10]);
  var path = d3.geoPath().projection(projection);

  var graticule = d3.geoGraticule().step([15, 15]);
  svg.append("path").datum(graticule()).attr("class", "graticule").attr("d", path);

  var landGroup = svg.append("g");
  var routeGroup = svg.append("g");
  var dotGroup = svg.append("g");

  var WORLD_URL = "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json";

  d3.json(WORLD_URL).then(function(world) {
    var countries = topojson.feature(world, world.objects.countries);
    window._landFeatures = countries.features;

    landGroup.selectAll("path").data(countries.features).enter()
      .append("path").attr("class", "land").attr("d", path);

    renderRoutes(35100);
  });

  function renderRoutes(destCode) {
    routeGroup.selectAll("*").remove();
    dotGroup.selectAll("*").remove();
    _waypointCache = {};

    var dc = regionCoords[destCode];
    if (!dc) return;
    var destPt = projection([dc.lng, dc.lat]);
    if (!destPt) return;

    // Convergence point (simplified)
    var convergePt = [destPt[0] - 60, destPt[1]];

    SOURCES.forEach(function(src, idx) {
      var sc = regionCoords[src];
      if (!sc) return;
      var srcPt = projection([sc.lng, sc.lat]);
      if (!srcPt) return;

      var wps = computeDynamicWaypoints(src, destCode, convergePt);
      var color = SOURCE_COLORS[idx];

      if (wps && wps.length > 0) {
        // Build projected points
        var allPts = [srcPt];
        wps.forEach(function(wp) {
          var p = projection([wp.lng, wp.lat]);
          if (p) allPts.push(p);
        });
        allPts.push(destPt);

        // Draw path using Catmull-Rom
        var line = d3.line().curve(d3.curveCatmullRom.alpha(0.5));
        routeGroup.append("path")
          .attr("class", "route")
          .attr("d", line(allPts))
          .attr("stroke", color)
          .attr("stroke-width", 2.5);

        // Draw waypoint dots
        wps.forEach(function(wp) {
          var p = projection([wp.lng, wp.lat]);
          if (p) {
            dotGroup.append("circle")
              .attr("class", "waypoint-dot")
              .attr("cx", p[0]).attr("cy", p[1]).attr("r", 3);
          }
        });
      } else {
        // Fallback: straight arc
        routeGroup.append("line")
          .attr("x1", srcPt[0]).attr("y1", srcPt[1])
          .attr("x2", destPt[0]).attr("y2", destPt[1])
          .attr("stroke", color).attr("stroke-width", 1)
          .attr("stroke-dasharray", "4,3").attr("opacity", 0.5);
      }

      // Source dot
      dotGroup.append("circle")
        .attr("class", "source-dot")
        .attr("cx", srcPt[0]).attr("cy", srcPt[1]).attr("r", 4);

      // Source label
      dotGroup.append("text")
        .attr("x", srcPt[0] + 6).attr("y", srcPt[1] + 3)
        .attr("fill", color).attr("font-size", "9px")
        .text(regionCoords[src].name);
    });

    // Destination dot
    dotGroup.append("circle")
      .attr("class", "dest-dot")
      .attr("cx", destPt[0]).attr("cy", destPt[1]).attr("r", 6);

    // Destination label
    dotGroup.append("text")
      .attr("x", destPt[0] + 8).attr("y", destPt[1] + 4)
      .attr("fill", "#e94560").attr("font-size", "11px").attr("font-weight", "bold")
      .text(dc.name + " (" + destCode + ")");
  }

  // Button handlers
  document.querySelectorAll("#controls button").forEach(function(btn) {
    btn.addEventListener("click", function() {
      document.querySelectorAll("#controls button").forEach(function(b) { b.classList.remove("active"); });
      btn.classList.add("active");
      var dest = parseInt(btn.getAttribute("data-dest"));
      renderRoutes(dest);
    });
  });
})();
</script>
</body>
</html>
